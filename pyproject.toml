[project]
name = "access-knowledge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "pytest>=9.1.1",
]

[project.scripts]
knowledge = "knowledge.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]

[tool.pytest.ini_options]
pythonpath = ["src"]

