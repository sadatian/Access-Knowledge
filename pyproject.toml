[project]
name = "access-knowledge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "faiss-gpu-cu12>=1.14.1.post1",
    "matplotlib>=3.11.1",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-plotly-plugin>=0.1.3",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "plotly>=6.9.0",
    "pytest>=9.1.1",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
]

[project.scripts]
knowledge = "knowledge.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]

[tool.pytest.ini_options]
pythonpath = ["src"]

