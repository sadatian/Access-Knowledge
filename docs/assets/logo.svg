<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Base -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="none" stroke="url(#grad1)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Neural Knowledge Nodes -->
  <!-- Center Hub -->
  <circle cx="50" cy="50" r="8" fill="url(#grad1)"/>
  
  <!-- Outer Satellite Nodes -->
  <circle cx="50" cy="22" r="5.5" fill="url(#grad2)"/>
  <circle cx="75" cy="35" r="5" fill="url(#grad1)"/>
  <circle cx="75" cy="65" r="5.5" fill="url(#grad2)"/>
  <circle cx="50" cy="78" r="5" fill="url(#grad1)"/>
  <circle cx="25" cy="65" r="5.5" fill="url(#grad2)"/>
  <circle cx="25" cy="35" r="5" fill="url(#grad1)"/>

  <!-- Connecting Knowledge Vectors -->
  <line x1="50" y1="50" x2="50" y2="22" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 2" opacity="0.85"/>
  <line x1="50" y1="50" x2="75" y2="35" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <line x1="50" y1="50" x2="75" y2="65" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 2" opacity="0.85"/>
  <line x1="50" y1="50" x2="50" y2="78" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <line x1="50" y1="50" x2="25" y2="65" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 2" opacity="0.85"/>
  <line x1="50" y1="50" x2="25" y2="35" stroke="#ffffff" stroke-width="2" opacity="0.85"/>

  <!-- Inter-satellite rings -->
  <line x1="50" y1="22" x2="75" y2="35" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6"/>
  <line x1="75" y1="35" x2="75" y2="65" stroke="url(#grad2)" stroke-width="1.5" opacity="0.6"/>
  <line x1="75" y1="65" x2="50" y2="78" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="78" x2="25" y2="65" stroke="url(#grad2)" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="65" x2="25" y2="35" stroke="url(#grad1)" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="35" x2="50" y2="22" stroke="url(#grad2)" stroke-width="1.5" opacity="0.6"/>
</svg>
